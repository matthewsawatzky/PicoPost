# PicoPost example configuration.
#
# Copy to ./picopost.toml and adjust. All values shown are the defaults.

[server]
listen = "127.0.0.1:8080"

[storage]
database = "./data/picopost.db"

# Origins allowed to call the API from browsers. Use ["*"] for a
# deliberately public mode. CORS is not security or authentication.
[cors]
origins = [
  "http://localhost:5173",
  "http://127.0.0.1:8081",
]

[posts]
max_body_bytes = 1024
max_text_bytes = 768
max_metadata_bytes = 256
max_metadata_keys = 16
max_key_length = 32
max_urls_per_post = 5
page_size = 50

[identity]
anonymous = true
browser = true

[rate_limit]
posts_per_minute = 20
# Only trust X-Forwarded-For / X-Real-IP when PicoPost sits behind a
# reverse proxy that overwrites them. Never enable on a public port.
trust_forwarded = false

[filters.username]
deny = [
  "admin",
  "administrator",
  "moderator",
  "system",
]

[filters.text]
deny = [
  # "blocked phrase",
  # "spam.example",
]
